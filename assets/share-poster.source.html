<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    width:1200px;height:630px;overflow:hidden;position:relative;
    background:#111013;color:#F7F3EC;font-family:"Space Grotesk",sans-serif;
  }
  .grid{
    position:absolute;inset:0;
    background-image:
      linear-gradient(to right,rgba(247,243,236,.055) 1px,transparent 1px),
      linear-gradient(to bottom,rgba(247,243,236,.055) 1px,transparent 1px);
    background-size:60px 60px;
    mask-image:radial-gradient(ellipse 85% 85% at 25% 45%,#000 25%,transparent 100%);
  }
  /* big soft glow behind the mark */
  .glow{
    position:absolute;right:-60px;top:70px;width:520px;height:520px;border-radius:50%;
    background:radial-gradient(circle,rgba(198,241,53,.20) 0%,rgba(198,241,53,0) 68%);
  }
  .stage{position:absolute;inset:0;padding:66px 74px;display:flex;flex-direction:column}
  .top{display:flex;align-items:flex-start;justify-content:space-between;gap:40px;flex:1}

  .badge{
    display:inline-flex;align-items:center;gap:13px;
    font-family:"JetBrains Mono",monospace;font-size:19px;letter-spacing:.02em;
    background:#F7F3EC;color:#111013;padding:13px 24px;border-radius:100px;
  }
  .dot{width:11px;height:11px;border-radius:50%;background:#FF4B1F}

  h1{font-size:118px;line-height:.84;letter-spacing:-.048em;text-transform:uppercase;margin-top:38px}
  .outline{color:transparent;-webkit-text-stroke:3px #F7F3EC}

  .role{
    font-family:"JetBrains Mono",monospace;font-size:24px;font-weight:700;
    text-transform:uppercase;margin-top:34px;letter-spacing:.01em;
  }
  .slash{color:#FF4B1F}

  .mark{flex-shrink:0;margin-top:6px}

  .rule{height:7px;background:linear-gradient(90deg,#FF4B1F 0%,#FF3D9A 32%,#8B5CF6 64%,#C6F135 100%);border-radius:4px}

  .foot{display:flex;align-items:center;justify-content:space-between;gap:30px;margin-top:26px}
  .chips{display:flex;gap:10px}
  .chips span{
    font-family:"JetBrains Mono",monospace;font-size:17px;
    padding:10px 17px;border-radius:100px;
    border:1px solid rgba(247,243,236,.26);color:#CFC9D6;
  }
  .url{font-family:"JetBrains Mono",monospace;font-size:21px;font-weight:700;color:#C6F135;white-space:nowrap}
</style>
</head>
<body>
  <div class="grid"></div>
  <div class="glow"></div>

  <div class="stage">
    <div class="top">
      <div>
        <div class="badge"><span class="dot"></span> KAMPALA, UGANDA</div>
        <h1>SEMUCYO<br><span class="outline">JOSHUA</span></h1>
        <div class="role">Software Engineer <span class="slash">/</span> Python <span class="slash">/</span> Backend</div>
      </div>

      <svg class="mark" width="188" height="188" viewBox="0 0 100 100">
        <rect width="100" height="100" rx="24" fill="#F7F3EC"/>
        <path d="M50 15 Q57 43 85 50 Q57 57 50 85 Q43 57 15 50 Q43 43 50 15 Z" fill="#111013"/>
        <circle cx="78" cy="22" r="7" fill="#FF4B1F"/>
      </svg>
    </div>

    <div class="rule"></div>
    <div class="foot">
      <div class="chips">
        <span>PYTHON</span><span>POSTGRESQL</span><span>FLUTTER</span><span>REACT</span><span>OFFLINE-FIRST</span>
      </div>
      <div class="url">light567482.github.io</div>
    </div>
  </div>
</body>
</html>
