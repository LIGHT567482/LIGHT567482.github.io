<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    width:1200px;height:630px;overflow:hidden;position:relative;
    background:#111013;color:#F7F3EC;font-family:"Space Grotesk",sans-serif;
    display:grid;grid-template-columns:780px 420px;
  }
  .grid{
    position:absolute;inset:0 420px 0 0;
    background-image:
      linear-gradient(to right,rgba(247,243,236,.06) 1px,transparent 1px),
      linear-gradient(to bottom,rgba(247,243,236,.06) 1px,transparent 1px);
    background-size:60px 60px;
    mask-image:radial-gradient(ellipse 90% 90% at 30% 45%,#000 20%,transparent 100%);
  }
  .left{position:relative;padding:62px 56px 56px 74px;display:flex;flex-direction:column}
  .badge{
    align-self:flex-start;display:inline-flex;align-items:center;gap:12px;
    font-family:"JetBrains Mono",monospace;font-size:18px;
    background:#F7F3EC;color:#111013;padding:12px 22px;border-radius:100px;
  }
  .dot{width:10px;height:10px;border-radius:50%;background:#FF4B1F}
  h1{font-size:104px;line-height:.84;letter-spacing:-.048em;text-transform:uppercase;margin-top:34px}
  .outline{color:transparent;-webkit-text-stroke:3px #F7F3EC}
  .role{
    font-family:"JetBrains Mono",monospace;font-size:22px;font-weight:700;
    text-transform:uppercase;margin-top:30px;letter-spacing:.01em;
  }
  .slash{color:#FF4B1F}
  .spacer{flex:1}
  .rule{height:7px;background:linear-gradient(90deg,#FF4B1F 0%,#FF3D9A 34%,#8B5CF6 66%,#C6F135 100%);border-radius:4px}
  .foot{display:flex;align-items:center;justify-content:space-between;gap:24px;margin-top:22px}
  .chips{display:flex;gap:9px}
  .chips span{
    font-family:"JetBrains Mono",monospace;font-size:15px;
    padding:9px 14px;border-radius:100px;
    border:1px solid rgba(247,243,236,.26);color:#CFC9D6;
  }
  .url{font-family:"JetBrains Mono",monospace;font-size:18px;font-weight:700;color:#C6F135;white-space:nowrap}

  /* 420x630 is exactly poster.jpeg's aspect ratio — the whole photo fits, uncropped */
  .photo{position:relative}
  .photo img{width:420px;height:630px;object-fit:cover;display:block}
  .photo::after{
    content:"";position:absolute;inset:0;
    background:linear-gradient(90deg,#111013 0%,rgba(17,16,19,.45) 14%,rgba(17,16,19,0) 42%);
  }
</style>
</head>
<body>
  <div class="grid"></div>

  <div class="left">
    <div class="badge"><span class="dot"></span> KAMPALA, UGANDA</div>
    <h1>SEMUCYO<br><span class="outline">JOSHUA</span></h1>
    <div class="role">Software Engineer <span class="slash">/</span> Python <span class="slash">/</span> Backend</div>
    <div class="spacer"></div>
    <div class="rule"></div>
    <div class="foot">
      <div class="chips">
        <span>PYTHON</span><span>POSTGRESQL</span><span>FLUTTER</span><span>REACT</span>
      </div>
      <div class="url">light567482.github.io</div>
    </div>
  </div>

  <div class="photo"><img src="poster.jpeg" alt=""></div>
</body>
</html>
